<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jensen vs Alice · Private Analytics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');
*{box-sizing:border-box}body{margin:0;padding:30px;background:#08151a;color:#dceedd;font:14px monospace}main{max-width:1000px;margin:auto}h1,h2{font-family:Silkscreen,monospace}h1{color:#9af574;font-size:23px}h2{color:#ddd;font-size:17px;margin-top:30px}input,button,select{padding:10px;background:#13282a;color:#e4ffe3;border:1px solid #618569;font:13px monospace}button{cursor:pointer}#login,#data{border-top:1px solid #375148;padding-top:18px}#data[hidden],#login[hidden]{display:none}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.metric{background:#122329;padding:13px}.metric label{font-size:11px;color:#9cb0a2;display:block}.metric strong{font-size:25px;color:#a5f57d}.bars{display:grid;gap:5px}.bar{display:flex;align-items:center;gap:8px}.bar label{min-width:110px}.bar i{display:block;height:17px;background:#8dde68;max-width:60%;min-width:1px}.bar span{font-size:12px}p{line-height:1.6}#error{color:#ff9f9f}
</style></head><body><main><h1>GPU EMPIRE — PRIVATE ANALYTICS</h1><p>Admin access requires a permanent Supabase Auth account explicitly listed in <code>game_admins</code>. Anonymous game players cannot access the dashboard.</p>
<section id="login"><input id="email" type="email" placeholder="Your admin email"><button id="send">EMAIL LOGIN LINK</button><p id="loginStatus"></p></section>
<section id="data" hidden><div><label for="days">Period </label><select id="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select> <button id="reload">REFRESH</button> <button id="logout">SIGN OUT</button></div><p id="dataStatus"></p><div class="metrics" id="metrics"></div><h2>VISITORS BY DAY</h2><div id="daily" class="bars"></div><h2>GAMES STARTED BY DAY</h2><div id="gamesDaily" class="bars"></div><h2>WAVE PROGRESSION</h2><div id="waves" class="bars"></div><h2>TRAFFIC SOURCES</h2><div id="sources" class="bars"></div><h2>MARKET SHOCKS</h2><div id="shocks" class="bars"></div><h2>DEVICE MIX</h2><div id="devices" class="bars"></div></section><p id="error" role="alert"></p></main><script src="config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const conf=window.JVA_SUPABASE,el=id=>document.getElementById(id);
if(!conf||conf.url.includes('REPLACE')){el('error').textContent='Connect the configured Supabase project in online/config.js before opening this dashboard.';throw Error('Not configured')}
const db=createClient(conf.url,conf.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const show=(id,yes)=>{el(id).hidden=!yes};
el('send').onclick=async()=>{const email=el('email').value.trim();if(!email)return;const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});el('loginStatus').textContent=error?error.message:'Check your inbox for the sign-in link.'};
el('logout').onclick=async()=>{await db.auth.signOut();show('data',false);show('login',true)};
el('reload').onclick=load;el('days').onchange=load;
function metric(name,value){const e=document.createElement('div');e.className='metric';const a=document.createElement('label'),b=document.createElement('strong');a.textContent=name;b.textContent=String(value);e.append(a,b);el('metrics').append(e)}
function bars(id,obj){const root=el(id);root.replaceChildren();const list=Object.entries(obj).slice(-30);const max=Math.max(1,...list.map(([,v])=>Number(v)||0));for(const [label,val] of list){const row=document.createElement('div');row.className='bar';const l=document.createElement('label'),bar=document.createElement('i'),n=document.createElement('span');l.textContent=label;bar.style.width=(60*(Number(val)||0)/max)+'%';n.textContent=String(val);row.append(l,bar,n);root.append(row)}}
async function load(){try{el('error').textContent='';el('dataStatus').textContent='Loading…';const {data}=await db.auth.getSession();if(!data.session)throw Error('Not signed in');const r=await fetch(conf.url+'/functions/v1/jva-game-api/admin?days='+el('days').value,{headers:{apikey:conf.publishableKey,Authorization:'Bearer '+data.session.access_token}});const m=await r.json();if(!r.ok)throw Error(m.error||'Access denied');show('login',false);show('data',true);el('metrics').replaceChildren();const pct=x=>(100*x).toFixed(1)+'%';[['Visits',m.visits],['Unique visitors',m.uniqueVisitors],['Visitors today',m.visitorsToday],['Games started',m.gamesStarted],['Completed games',m.gamesCompleted],['Visitor → player',pct(m.conversion)],['Avg score',Math.round(m.averageScore)],['Avg wave',m.averageWave.toFixed(1)],['Avg duration',Math.round(m.averageDuration)+' sec'],['Avg final valuation','$'+m.averageFinalValuation.toFixed(0)+'B'],['Replay rate',pct(m.replayRate)],['Returning rate',pct(m.returningRate)],['Victory rate',pct(m.victoryRate)],['Boss defeat rate',m.bossSpawns?pct(m.bossDefeats/m.bossSpawns):'—']].forEach(([k,v])=>metric(k,v));bars('daily',Object.fromEntries(m.daily.map(x=>[x.date,x.visits])));bars('gamesDaily',Object.fromEntries(m.daily.map(x=>[x.date,x.games])));bars('waves',m.waveHistogram);bars('sources',m.sources);bars('shocks',m.shocks);bars('devices',m.devices);el('dataStatus').textContent=m.sampled?'Showing a maximum of 10,000 recent records per category.':'Metrics loaded.'}catch(e){el('error').textContent=e.message;el('dataStatus').textContent='';}}
const {data}=await db.auth.getSession();if(data.session){await load()}
</script></body></html>
