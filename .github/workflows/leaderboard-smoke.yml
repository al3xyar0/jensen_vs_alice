name: Leaderboard API smoke test
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/leaderboard-smoke.yml','scripts/leaderboard-smoke.mjs']
  push:
    branches: [feature/supabase-leaderboard-analytics]
    paths: ['.github/workflows/leaderboard-smoke.yml','scripts/leaderboard-smoke.mjs']
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.57.0
      - name: Check anonymous player and real score submission
        run: node scripts/leaderboard-smoke.mjs
